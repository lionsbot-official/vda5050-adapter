name: Release

# Git refs arrive via deploy key; the workflow token creates the source Release.
on:
  push:
    tags: ['v3.0.0*', 'v2.1.0*', 'v2.0.0*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create or refresh (v3.0.0, v2.1.0+adapter.1; legacy v1.0.0 supported)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ "$TAG" =~ ^v(3\.0\.0|2\.1\.0|2\.0\.0)(\+adapter\.[1-9][0-9]*)?$ ]]; then
            PROTOCOL="${BASH_REMATCH[1]}"
          elif [[ "$INPUT_TAG" == v1.0.0 ]]; then
            PROTOCOL=3.0.0
          else
            echo "::error::Unsupported release tag: $TAG"
            exit 1
          fi
          BRANCH="vda-$PROTOCOL"
          [[ "$PROTOCOL" != 3.0.0 ]] || BRANCH=main
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "protocol=$PROTOCOL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify support line
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PROTOCOL: ${{ steps.tag.outputs.protocol }}
          BRANCH: ${{ steps.tag.outputs.branch }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$BRANCH"
          if [[ "$TAG" != v1.0.0 ]]; then
            DECLARED=$(sed -n 's/^[[:space:]]*Version[[:space:]]*string `default:"\([0-9.]*\)"`.*/\1/p' foundation/env/env.go)
            [[ "$DECLARED" == "$PROTOCOL" ]]
            grep -Fx "MASTER_VERSION=$PROTOCOL" .example.env
            grep -F "if version != \"$PROTOCOL\" {" business/masterbus/bus.go
            REFERENCES=$(git ls-tree --name-only HEAD:reference | grep '^VDA5050-' || true)
            [[ "$REFERENCES" == "VDA5050-$PROTOCOL" ]]
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PROTOCOL: ${{ steps.tag.outputs.protocol }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## [" version "] - ") == 1 && substr($0, length("## [" version "] - ") + 1) ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) { found=1; next } }
            found && /^\[[^]]*\]: / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md"
          {
            printf 'VDA5050 %s · adapter release v%s\n\n' "$PROTOCOL" "$VERSION"
            printf 'Source-only release. Build from this tag; see its README for supported capabilities and limitations.\n\n'
            cat "$RUNNER_TEMP/changes.md"
          } > "$RUNNER_TEMP/notes.md"

      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PROTOCOL: ${{ steps.tag.outputs.protocol }}
        run: |
          set -euo pipefail
          LATEST=false
          [[ "$PROTOCOL" != 3.0.0 || "$TAG" == v1.0.0 ]] || LATEST=true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest="$LATEST"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest="$LATEST"
          fi
